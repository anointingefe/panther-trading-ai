app:
  mode: paper
  symbol: EURUSD
  timeframe: M15
  candles: 120

risk:
  account_equity: 10000
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  min_confidence: 0.62
  max_open_positions: 3
  max_positions_per_symbol: 1

strategy:
  fast_sma: 10
  slow_sma: 30
  sentiment_weight: 0.25

execution:
  allow_live_trading: false
  default_volume: 0.01
  require_manual_approval: true
  max_live_volume: 0.1
  allowed_live_account_modes:
    - demo
  live_unlock_phrase: PANTHER_LIVE_APPROVED

demo_auto:
  enabled: false
  interval_seconds: 300
  max_symbols_per_cycle: 8
  demo_order_volume: 0.01
  allowed_account_modes:
    - demo
    - contest
    - paper

validation:
  min_demo_trades: 30
  min_demo_days: 14
  min_profit_factor: 1.2
  min_net_r: 5.0
  min_win_rate: 0.35
  max_drawdown_r: 6.0
