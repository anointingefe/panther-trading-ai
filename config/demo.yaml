app:
  mode: paper
  symbol: EURUSD
  timeframe: M15
  candles: 120

risk:
  account_equity: 10000
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  min_confidence: 0.70
  max_open_positions: 2
  max_positions_per_symbol: 1

strategy:
  fast_sma: 10
  slow_sma: 30
  sentiment_weight: 0.25

execution:
  allow_live_trading: false
  default_volume: 0.01
  require_manual_approval: true
  max_live_volume: 0.02
  allowed_live_account_modes:
    - demo
  live_unlock_phrase: PANTHER_LIVE_APPROVED

demo_auto:
  enabled: false
  interval_seconds: 30
  max_symbols_per_cycle: 96
  max_orders_per_cycle: 6
  max_open_positions: 6
  max_positions_per_symbol: 1
  demo_order_volume: 0.01
  scout_min_confidence: 0.70
  scout_volume_multiplier: 0.0
  loss_cooldown_hours: 12
  max_consecutive_symbol_losses: 1
  volatility_spike_multiplier: 2.5
  temporal_min_samples: 8
  temporal_min_win_rate: 0.70
  bayes_prior_wins: 3.0
  bayes_prior_losses: 2.0
  bayes_confidence_weight: 0.50
  symbol_min_closed_trades: 6
  symbol_min_win_rate: 0.55
  symbol_min_net_pnl: 0.0
  symbol_min_edge_probability: 0.55
  max_kelly_fraction: 0.003
  exit_max_trade_minutes: 240
  exit_breakeven_at_r: 1.0
  exit_trail_at_r: 1.5
  allowed_account_modes:
    - demo
    - contest
    - paper

live_scout:
  enabled: true
  interval_seconds: 30
  max_symbols_per_cycle: 96
  max_candidates_per_cycle: 12
  history_sync_days: 30
  learning_min_segment_samples: 6
  ticket_max_age_seconds: 120
  allowed_account_modes:
    - demo
    - contest
    - real

validation:
  min_demo_trades: 30
  min_demo_days: 14
  min_profit_factor: 1.2
  min_net_r: 5.0
  min_win_rate: 0.35
  max_drawdown_r: 6.0

shadow_execution:
  enabled: true
  interval_seconds: 30
  max_symbols_per_cycle: 48
  max_samples_retained: 1000
  max_observation_minutes: 240
  min_samples: 50
  min_reconciliation_samples: 20
  min_preflight_pass_rate: 0.99
  min_quote_fresh_rate: 0.99
  max_quote_age_seconds: 10.0
  max_spread_to_stop_ratio: 0.25
  max_reconciliation_mismatches: 0

beast_mode:
  enabled: false
  demo_order_multiplier: 1.0
  live_risk_multiplier: 1.0
  live_volume_multiplier: 1.0
  confidence_floor_delta: 0.0
  scout_floor_delta: 0.0
  extra_orders_per_cycle: 0
  extra_open_positions: 0
  max_risk_per_trade_pct_cap: 1.0
  max_live_volume_cap: 0.02
  disable_after_daily_loss: true
